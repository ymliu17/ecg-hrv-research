[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ecg-hrv-research"
version = "0.1.0"
description = "Auditable ECG-to-HRV research pipelines with timestamp-preserving RR handling"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Science/Research", "Programming Language :: Python :: 3", "Topic :: Scientific/Engineering"]
dependencies = ["numpy>=1.26,<3", "pandas>=2.2,<3", "scipy>=1.12,<2", "neurokit2==0.2.13"]

[project.optional-dependencies]
biopac = ["bioread==2025.5.2"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
ecg-hrv = "ecg_hrv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
